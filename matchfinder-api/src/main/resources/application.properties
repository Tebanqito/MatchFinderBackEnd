spring.application.name=matchfinder

# Base de datos PostgreSQL (se configura con variables de entorno; ejecutar.ps1 las carga)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchfinder}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Errores en formato Problem Details (RFC 7807)
spring.mvc.problemdetails.enabled=true

# JWT: clave en Base64 (minimo 256 bits) y duracion del token (8 horas)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

# Clave para dar de alta al owner (minimo 32 caracteres). Si no esta definida, el alta queda deshabilitada.
app.owner.registration-key=${OWNER_REGISTRATION_KEY:}
